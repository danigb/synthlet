name: Run Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Every package commits its worklet as a minified esbuild bundle: src/processor.ts,
      # built from src/worklet.ts. The build above just rewrote all of them, so any diff
      # here means the committed copy was stale. Do not add turbo caching to CI without
      # rechecking this: a cached build restores dist/ only and leaves these files alone.
      - name: Check the generated processors are in sync
        run: |
          git diff --exit-code --stat -- 'packages/*/src/processor.ts' || {
            echo "::error::A generated worklet bundle is out of date. Run 'npm run build' and commit the result."
            git status --porcelain -- 'packages/*/src/processor.ts'
            exit 1
          }

      # Rate bugs are silent: a k-rate read of an a-rate parameter does not throw,
      # does not warn, and produces audio that still sounds like audio. This reads
      # each package's params.ts and its processor together, which is the only
      # thing that would have caught `Math.floor(params.type)` in
      # virtual-analog-filter - correct by accident for its whole life, and one
      # rate change away from silently selecting the wrong filter model.
      - name: Check a-rate parameters are read per sample
        run: npm run check:rates

      - name: Run tests
        run: npm run test
