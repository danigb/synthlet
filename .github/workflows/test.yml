name: Run Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Every package commits its worklet as a minified esbuild bundle: src/processor.ts,
      # or src/_processor.ts in level-meter, which calls its worklet source processor.ts.
      # The build above just rewrote all of them, so any diff here means the committed copy
      # was stale. Do not add turbo caching to CI without rechecking this: a cached build
      # restores dist/ only and leaves these files alone.
      - name: Check the generated processors are in sync
        run: |
          git diff --exit-code --stat -- 'packages/*/src/processor.ts' 'packages/*/src/_processor.ts' || {
            echo "::error::A generated worklet bundle is out of date. Run 'npm run build' and commit the result."
            git status --porcelain -- 'packages/*/src/processor.ts' 'packages/*/src/_processor.ts'
            exit 1
          }

      - name: Run tests
        run: npm run test
