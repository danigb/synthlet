name: Run Tests

on:
  pull_request:
    branches: [main]

jobs:
  # Everything that has to read the whole repo at once: formatting, the build,
  # and the two generated-code checks that depend on it.
  #
  # This runs *beside* the test shards, not before them. Jest's
  # moduleNameMapper points `@synthlet/*` at `packages/*/src`, so the tests
  # import package sources and never touch `dist/` - there is nothing for them
  # to wait for.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Every package commits its worklet as a minified esbuild bundle: src/processor.ts,
      # or src/_processor.ts in level-meter, which calls its worklet source processor.ts.
      # The build above just rewrote all of them, so any diff here means the committed copy
      # was stale. Do not add turbo caching to CI without rechecking this: a cached build
      # restores dist/ only and leaves these files alone.
      - name: Check the generated processors are in sync
        run: |
          git diff --exit-code --stat -- 'packages/*/src/processor.ts' 'packages/*/src/_processor.ts' || {
            echo "::error::A generated worklet bundle is out of date. Run 'npm run build' and commit the result."
            git status --porcelain -- 'packages/*/src/processor.ts' 'packages/*/src/_processor.ts'
            exit 1
          }

      # Rate bugs are silent: a k-rate read of an a-rate parameter does not throw,
      # does not warn, and produces audio that still sounds like audio. This reads
      # each package's params.ts and its processor together, which is the only
      # thing that would have caught `Math.floor(params.type)` in
      # virtual-analog-filter - correct by accident for its whole life, and one
      # rate change away from silently selecting the wrong filter model.
      - name: Check a-rate parameters are read per sample
        run: npm run check:rates

  # The suite is CPU-bound and a hosted runner has 4 cores, so the wall clock
  # is set by how much work lands on one machine. Four shards split it four
  # ways. Six were tried and were no faster: one package's test file is the
  # long pole, and jest shards by file, so it cannot be split further.
  #
  # `fail-fast: false` so a failure in one shard still reports the others -
  # with an audio DSP change, knowing whether one package broke or all four is
  # most of the diagnosis.
  shard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No `--coverage`: there is no `coverageThreshold`, nothing uploads the
      # report and nothing reads it, so instrumenting the run only spent time.
      # `npm run test:coverage` still produces it on demand.
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        run: npx jest --shard=${{ matrix.shard }}/4

  # `test` is the required status check on main, so the name has to survive.
  # It is now an aggregate: the shards report under their own names, and this
  # passes only when every one of them - and the build - did.
  test:
    runs-on: ubuntu-latest
    needs: [build, shard]
    if: always()

    steps:
      - name: Check that every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::build: ${{ needs.build.result }}, shards: ${{ needs.shard.result }}"
          exit 1

      - name: All green
        run: echo "build and all 4 test shards passed"
