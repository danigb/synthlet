<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" role="img" aria-label="Bar chart of the first eight harmonics of a sawtooth wave, the nth at one over n">
  <!-- Every stroke and fill is `currentColor`, so the figure inherits the
       lesson's ink token and restyles with the rest of the section. A colour
       here would be design walking into content through an image. -->
  <g fill="currentColor">
    <rect x="24" y="26" width="12" height="94" />
    <rect x="60" y="73" width="12" height="47" />
    <rect x="96" y="89" width="12" height="31" />
    <rect x="132" y="97" width="12" height="23" />
    <rect x="168" y="101" width="12" height="19" />
    <rect x="204" y="104" width="12" height="16" />
    <rect x="240" y="107" width="12" height="13" />
    <rect x="276" y="108" width="12" height="12" />
  </g>
  <line x1="16" y1="120" x2="324" y2="120" stroke="currentColor" stroke-width="1" />
  <g fill="currentColor" font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="30" y="136">1</text>
    <text x="66" y="136">2</text>
    <text x="102" y="136">3</text>
    <text x="138" y="136">4</text>
    <text x="174" y="136">5</text>
    <text x="210" y="136">6</text>
    <text x="246" y="136">7</text>
    <text x="282" y="136">8</text>
    <text x="316" y="136">n</text>
  </g>
  <text x="16" y="18" fill="currentColor" font-family="sans-serif" font-size="11">amplitude = 1/n</text>
</svg>
